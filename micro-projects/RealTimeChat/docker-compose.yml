services:
  redis:
    image: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - traefik-net
 
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    labels:
          - "traefik.enable=true"
          - "traefik.http.routers.backend.rule=Host(`api.polyk.space`)"
          - "traefik.http.routers.backend.entrypoints=websecure"
          - "traefik.http.routers.backend.tls.certresolver=myresolver"
          - "traefik.http.services.backend.loadbalancer.server.port=5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Redis=redis:6379
      - Db_Connection_String=Host=db;Port=5432;Database=mydatabase;User Id=myuser;Password=mypassword
    depends_on:
      - redis
      - db
    networks:
      - traefik-net
 
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    labels:
          - "traefik.enable=true"
          - "traefik.http.routers.frontend.rule=Host(`varya.polyk.space`)"
          - "traefik.http.routers.frontend.entrypoints=websecure"
          - "traefik.http.routers.frontend.tls.certresolver=myresolver"
          - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - traefik-net

  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - traefik-net

networks:
  traefik-net:
    external: true

volumes:
  pgdata:
