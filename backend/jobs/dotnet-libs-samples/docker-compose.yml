services:
  postgres:
    image: postgres:17-alpine
    container_name: jobs-playground-postgres
    environment:
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs_demo_password
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - jobs-postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  jobs-postgres-data:
