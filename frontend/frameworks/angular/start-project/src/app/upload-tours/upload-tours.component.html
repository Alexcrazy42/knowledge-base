<div class="container">
  <h2>Загрузить новый тур</h2>
  <form (ngSubmit)="uploadTour()">
    <label for="name">Название тура:</label>
    <input type="text" id="name" [(ngModel)]="tour.name" name="name" required />

    <label for="description">Описание:</label>
    <textarea id="description" [(ngModel)]="tour.description" name="description" required></textarea>

    <label for="price">Цена:</label>
    <input type="number" id="price" [(ngModel)]="tour.price" name="price" required />

    <button type="submit">Загрузить</button>
  </form>
</div>
