<div class="container">
  <h2>Оформление покупки</h2>
  <form (ngSubmit)="purchaseTour()">
    <label for="tourName">Название тура:</label>
    <input type="text" id="tourName" [(ngModel)]="tourName" name="tourName" required />

    <label for="buyerName">Ваше имя:</label>
    <input type="text" id="buyerName" [(ngModel)]="buyerName" name="buyerName" required />

    <label for="buyerEmail">Ваш email:</label>
    <input type="email" id="buyerEmail" [(ngModel)]="buyerEmail" name="buyerEmail" required />

    <button type="submit">Купить</button>
  </form>
</div>
