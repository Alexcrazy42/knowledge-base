<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Геолокация на карте</title>
  <!-- Подключение стилей Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css " />
  <style>
    #map {
      height: 500px;
      width: 100%;
    }
  </style>
</head>
<body>

  <h2>Отслеживание местоположения на карте</h2>

  <button id="stopTracking">Остановить отслеживание</button>

  <div id="map"></div>

  <!-- Подключение скриптов Leaflet -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js "></script>
  <script src="script.js"></script>
</body>
</html>
