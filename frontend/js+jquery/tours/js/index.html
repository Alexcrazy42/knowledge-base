<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Поиск и бронирование туров</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Главная страница -->
  <div id="search-page" class="page active fade-in">
    <h1>Поиск туров</h1>
    <form id="tour-search-form">
      <label for="destination">Направление:</label>
      <input type="text" id="destination" name="destination" required>
      <span class="error-message" id="destination-error"></span>

      <label for="date">Дата:</label>
      <input type="date" id="date" name="date" required>
      <span class="error-message" id="date-error"></span>

      <label for="duration">Продолжительность (дней):</label>
      <input type="number" id="duration" name="duration" min="1" required>
      <span class="error-message" id="duration-error"></span>

      <button type="submit">Найти туры</button>
    </form>
  </div>

  <!-- Результаты поиска -->
  <div id="results-page" class="page fade-out">
    <h1>Результаты поиска</h1>
    <ul id="tour-list"></ul>
    <button id="back-to-search">Вернуться к поиску</button>
  </div>

  <!-- Подтверждение бронирования -->
  <div id="booking-page" class="page fade-out">
    <h1>Подтвердите бронирование</h1>
    <form id="booking-form">
      <label for="name">Имя:</label>
      <input type="text" id="name" name="name" required>
      <span class="error-message" id="name-error"></span>

      <label for="email">Email:</label>
      <input type="email" id="email" name="email" required>
      <span class="error-message" id="email-error"></span>

      <label for="phone">Телефон:</label>
      <input type="tel" id="phone" name="phone" required>
      <span class="error-message" id="phone-error"></span>

      <button type="submit">Забронировать</button>
    </form>
    <p id="booking-message"></p>
    <button id="back-to-results">Вернуться к результатам</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
